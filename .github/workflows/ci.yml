# 2026-10-09 22:32 KST: CodexCode - Linux tests, shell checks and distributable builds.
name: Verify and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # 2026-10-16 03:27 KST: exercise real PowerShell behavior with private fixtures on Windows.
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_windows_helper.py -v
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/test_windows_clipboard.ps1
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests
      - run: bash -n scripts/install.sh
      - run: bash -n scripts/setup_vnc.sh
      - run: node --check src/zero2w_kvm/static/pi.js
      - run: node --test tests/test_browser.js
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: zero2w-kvm-python-${{ matrix.python }}
          path: dist/*
